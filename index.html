<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>সততা সপ | Online Shop</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans Bengali",sans-serif;background:#f5f7fb;color:#202633}
header{background:#087b45;color:white;padding:14px 16px}
.top{display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;object-fit:contain;border-radius:10px;background:white}
.brand{font-size:22px;font-weight:bold}
header p{margin:5px 0 0;font-size:13px}
.banner{width:100%;max-height:260px;object-fit:cover;display:none}
.promo{background:#fff1c8;color:#6d4600;padding:12px;text-align:center;font-weight:bold}
.container{max-width:1100px;margin:auto;padding:16px}
.search{width:100%;padding:13px;border:1px solid #d4d9e1;border-radius:10px;font-size:16px;margin-bottom:14px}
.categories{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px}
.cat{border:1px solid #ddd;background:white;padding:9px 14px;border-radius:20px;white-space:nowrap;cursor:pointer}
.cat.active{background:#087b45;color:white}
h2{font-size:20px}
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:white;border-radius:13px;overflow:hidden;box-shadow:0 2px 9px #0000000b}
.card img{width:100%;height:160px;object-fit:cover;background:#eee}
.card-body{padding:11px}
.card h3{font-size:15px;margin:0 0 8px}
.price{font-weight:bold;color:#087b45;font-size:18px}
.stock{font-size:12px;color:#687385;margin:7px 0}
.btn{display:inline-block;border:0;border-radius:8px;background:#087b45;color:white;padding:11px 13px;cursor:pointer;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.secondary{background:#e8f4ed;color:#08683a}
.order-box,.support{background:white;border-radius:13px;padding:16px;margin-top:20px}
.order-box{display:none}
form{display:grid;grid-template-columns:1fr;gap:12px}
label{font-size:14px;font-weight:bold}
input,select,textarea{width:100%;padding:12px;border:1px solid #d3d9e1;border-radius:8px;font-size:15px;margin-top:5px;background:white}
textarea{min-height:80px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.summary{background:#f0f8f3;border-radius:9px;padding:12px;line-height:1.8}
.message{padding:12px;border-radius:8px;margin-top:10px;display:none;overflow-wrap:anywhere}
.ok{background:#e6f7ed;color:#075b32}
.err{background:#fff0f0;color:#9c2020}
.support-links{display:flex;flex-wrap:wrap;gap:8px}
.support-links a{color:#087b45;background:#e8f4ed;text-decoration:none;padding:10px;border-radius:8px}
footer{text-align:center;padding:25px;color:#6b7280;font-size:13px}
.empty{background:white;padding:20px;border-radius:10px;text-align:center}
@media(min-width:650px){
 .products{grid-template-columns:repeat(3,minmax(0,1fr))}
 .card img{height:210px}
 form{grid-template-columns:1fr 1fr}
 .full{grid-column:1/-1}
}
@media(min-width:950px){.products{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>

<body>

<header>
  <div class="top">
    <img id="logo" class="logo" alt="সততা সপ লোগো" hidden>
    <div>
      <div class="brand" id="siteName">সততা সপ</div>
      <p>বিশ্বস্ত অনলাইন শপিং</p>
    </div>
  </div>
</header>

<img id="banner" class="banner" alt="সততা সপ ব্যানার">
<div id="promo" class="promo" hidden></div>

<main class="container">
  <h2>আমাদের পণ্য</h2>
  <input id="search" class="search" placeholder="পণ্যের নাম লিখে খুঁজুন..." aria-label="পণ্য খুঁজুন">

  <div id="categories" class="categories"></div>
  <div id="productList" class="products">
    <div class="empty">Firebase থেকে পণ্য লোড হচ্ছে...</div>
  </div>

  <section id="orderBox" class="order-box">
    <h2>অর্ডার ফর্ম</h2>
    <p id="selectedName"></p>

    <div class="summary">
      পণ্যের দাম: ৳<span id="unitPrice">0</span><br>
      পণ্যের মোট: ৳<span id="productTotal">0</span><br>
      ডেলিভারি চার্জ: ৳<span id="deliveryCost">70</span><br>
      <strong>সর্বমোট: ৳<span id="grandTotal">0</span></strong>
    </div>

    <form id="orderForm">
      <div>
        <label for="customerName">ক্রেতার নাম *</label>
        <input id="customerName" name="name" required maxlength="100" autocomplete="name">
      </div>
      <div>
        <label for="phone">মোবাইল নম্বর *</label>
        <input id="phone" name="phone" type="tel" required maxlength="20" autocomplete="tel">
      </div>

      <div>
        <label for="division">বিভাগ *</label>
        <input id="division" name="division" required maxlength="100">
      </div>
      <div>
        <label for="district">জেলা *</label>
        <input id="district" name="district" required maxlength="100">
      </div>

      <div>
        <label for="area">থানা / উপজেলা *</label>
        <input id="area" name="area" required maxlength="100">
      </div>
      <div>
        <label for="village">গ্রাম / এলাকা *</label>
        <input id="village" name="village" required maxlength="150">
      </div>

      <div class="full">
        <label for="address">সম্পূর্ণ ঠিকানা *</label>
        <textarea id="address" name="address" required maxlength="500"
          placeholder="বাড়ি, রাস্তা ও অন্যান্য ঠিকানা লিখুন"></textarea>
      </div>

      <div>
        <label for="deliveryZone">ডেলিভারি এলাকা *</label>
        <select id="deliveryZone" name="deliveryZone" required>
          <option value="ঢাকার ভিতরে">ঢাকার ভিতরে — ৳70</option>
          <option value="ঢাকার বাইরে">ঢাকার বাইরে — ৳120</option>
        </select>
      </div>
      <div>
        <label for="parcelPoint">পার্সেল নেওয়ার স্থান</label>
        <input id="parcelPoint" name="parcelPoint" maxlength="150"
          placeholder="কুরিয়ার পয়েন্ট বা বাসার ঠিকানা">
      </div>

      <div>
        <label for="size">সাইজ</label>
        <input id="size" name="size" maxlength="50" placeholder="যেমন: M, L, XL">
      </div>
      <div>
        <label for="color">রং</label>
        <input id="color" name="color" maxlength="50" placeholder="পছন্দের রং">
      </div>

      <div>
        <label for="quantity">পরিমাণ *</label>
        <input id="quantity" name="quantity" type="number" min="1" max="20" value="1" required>
      </div>
      <div>
        <label>পেমেন্ট</label>
        <input value="Cash on Delivery (পণ্য হাতে পেয়ে মূল্য দিন)" readonly>
      </div>

      <div class="full">
        <button id="submitOrder" class="btn" type="submit" style="width:100%">
          অর্ডার নিশ্চিত করুন
        </button>
        <button id="cancelOrder" class="btn secondary" type="button" style="width:100%;margin-top:8px">
          বাতিল করুন
        </button>
      </div>
    </form>

    <div id="orderMessage" class="message" role="status" aria-live="polite"></div>
  </section>

  <section class="support">
    <h2>সাহায্য ও যোগাযোগ</h2>
    <p id="supportText">পণ্য বা অর্ডার সম্পর্কে জানতে আমাদের সঙ্গে যোগাযোগ করুন।</p>
    <div id="supportLinks" class="support-links"></div>
  </section>
</main>

<footer>© <span id="year"></span> সততা সপ — সর্বস্বত্ব সংরক্ষিত</footer>

<script type="module">
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
  getFirestore, collection, onSnapshot, doc, getDoc, addDoc, serverTimestamp
} from
  "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

/* Firebase Console → Project settings → Your apps থেকে
   প্রয়োজনে এই কনফিগারেশন মিলিয়ে নেবে। */

const firebaseConfig = {
  apiKey: "AIzaSyDHHTt4EFkH_H5xc2q2rGTC2piSCjOJuKM",
  authDomain: "satata-shop.firebaseapp.com",
  projectId: "satata-shop",
  storageBucket: "satata-shop.firebasestorage.app",
  messagingSenderId: "964264833764",
  appId: "1:964264833764:web:7c77ae2f3cb8c782abf2f1",
  measurementId: "G-1H2H45YG3D"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const $ = id => document.getElementById(id);

let allProducts = [];
let selectedProduct = null;
let activeCategory = "সব";
let stopProducts = null;

$("year").textContent = new Date().getFullYear();

function money(value) {
  return Math.max(0, Number(value) || 0);
}

function safeText(value) {
  return String(value ?? "");
}

function getImage(product) {
  if (Array.isArray(product.images) && product.images.length) {
    return product.images[0];
  }
  return product.image || product.imageUrl || "";
}

function showMessage(message, type = "ok") {
  const el = $("orderMessage");
  el.textContent = message;
  el.className = "message " + type;
  el.style.display = "block";
}

function renderCategories() {
  const names = ["সব", ...new Set(
    allProducts.map(p => p.category).filter(Boolean)
  )];

  const root = $("categories");
  root.replaceChildren();

  names.forEach(name => {
    const button = document.createElement("button");
    button.className = "cat" + (name === activeCategory ? " active" : "");
    button.textContent = name;
    button.type = "button";
    button.addEventListener("click", () => {
      activeCategory = name;
      renderCategories();
      renderProducts();
    });
    root.appendChild(button);
  });
}

function renderProducts() {
  const root = $("productList");
  root.replaceChildren();

  const query = $("search").value.trim().toLowerCase();

  const filtered = allProducts.filter(p => {
    const matchesCategory =
      activeCategory === "সব" || p.category === activeCategory;
    const matchesSearch =
      safeText(p.name).toLowerCase().includes(query) ||
      safeText(p.category).toLowerCase().includes(query);
    return matchesCategory && matchesSearch;
  });

  if (!filtered.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = allProducts.length
      ? "কোনো মিল থাকা পণ্য পাওয়া যায়নি।"
      : "এখনো কোনো পণ্য যোগ করা হয়নি।";
    root.appendChild(empty);
    return;
  }

  filtered.forEach(p => {
    const card = document.createElement("article");
    card.className = "card";

    const image = document.createElement("img");
    image.loading = "lazy";
    image.alt = safeText(p.name);
    image.src = getImage(p);
    image.onerror = () => { image.style.display = "none"; };

    const body = document.createElement("div");
    body.className = "card-body";

    const name = document.createElement("h3");
    name.textContent = safeText(p.name || "নামহীন পণ্য");

    const price = document.createElement("div");
    price.className = "price";
    price.textContent = "৳" + money(p.price).toLocaleString("en-US");

    const stock = document.createElement("div");
    stock.className = "stock";
    const hasStock = p.stock === undefined || Number(p.stock) > 0;
    stock.textContent = hasStock ? "স্টক আছে / যাচাইসাপেক্ষ" : "স্টক শেষ";

    const details = document.createElement("p");
    details.style.fontSize = "13px";
    details.textContent = safeText(p.description || p.category || "");

    const button = document.createElement("button");
    button.className = "btn";
    button.type = "button";
    button.textContent = "অর্ডার করুন";
    button.disabled = !hasStock || money(p.price) <= 0;
    button.addEventListener("click", () => openOrder(p));

    body.append(name, price, stock, details, button);
    card.append(image, body);
    root.appendChild(card);
  });
}

function openOrder(product) {
  selectedProduct = product;
  $("selectedName").textContent =
    "নির্বাচিত পণ্য: " + safeText(product.name);
  $("unitPrice").textContent = money(product.price);
  $("orderBox").style.display = "block";
  $("orderMessage").style.display = "none";
  $("quantity").value = "1";
  $("orderBox").scrollIntoView({ behavior: "smooth", block: "start" });
  updateTotals();
}

function updateTotals() {
  if (!selectedProduct) return;

  const quantity = Math.min(20, Math.max(1, Number($("quantity").value) || 1));
  const zone = $("deliveryZone").value;
  const delivery = zone === "ঢাকার বাইরে" ? 120 : 70;
  const productTotal = money(selectedProduct.price) * quantity;

  $("deliveryCost").textContent = delivery;
  $("productTotal").textContent = productTotal.toLocaleString("en-US");
  $("grandTotal").textContent =
    (productTotal + delivery).toLocaleString("en-US");
}

$("search").addEventListener("input", renderProducts);
$("quantity").addEventListener("input", updateTotals);
$("deliveryZone").addEventListener("change", updateTotals);

$("cancelOrder").addEventListener("click", () => {
  $("orderBox").style.display = "none";
  selectedProduct = null;
});

$("orderForm").addEventListener("submit", async event => {
  event.preventDefault();

  if (!selectedProduct) {
    showMessage("আগে একটি পণ্য নির্বাচন করুন।", "err");
    return;
  }

  const button = $("submitOrder");
  button.disabled = true;
  button.textContent = "অর্ডার জমা হচ্ছে...";

  try {
    const quantity = Math.min(20, Math.max(1, Number($("quantity").value) || 1));
    const unitPrice = money(selectedProduct.price);
    const productTotal = unitPrice * quantity;
    const deliveryZone = $("deliveryZone").value;
    const deliveryCharge = deliveryZone === "ঢাকার বাইরে" ? 120 : 70;
    const total = productTotal + deliveryCharge;

    if (!safeText($("customerName").value).trim() ||
        !safeText($("phone").value).trim() ||
        !safeText($("division").value).trim() ||
        !safeText($("district").value).trim() ||
        !safeText($("area").value).trim() ||
        !safeText($("village").value).trim() ||
        !safeText($("address").value).trim()) {
      throw new Error("সব প্রয়োজনীয় ঘর পূরণ করুন।");
    }

    const orderData = {
      productId: safeText(selectedProduct.id),
      productName: safeText(selectedProduct.name),
      unitPrice,
      productTotal,
      deliveryCharge,
      total,
      name: $("customerName").value.trim(),
      phone: $("phone").value.trim(),
      quantity: String(quantity),
      deliveryZone,
      division: $("division").value.trim(),
      district: $("district").value.trim(),
      area: $("area").value.trim(),
      village: $("village").value.trim(),
      address: $("address").value.trim(),
      parcelPoint: $("parcelPoint").value.trim(),
      size: $("size").value.trim(),
      color: $("color").value.trim(),
      payment: "Cash on Delivery",
      status: "অর্ডার গ্রহণের অপেক্ষায়",
      createdAt: serverTimestamp()
    };

    const result = await addDoc(collection(db, "orders"), orderData);

    showMessage(
      "অর্ডার জমা হয়েছে। আপনার অর্ডার নম্বর: " + result.id +
      "। নম্বরটি সংরক্ষণ করে রাখুন।",
      "ok"
    );

    $("orderForm").reset();
    $("quantity").value = "1";
    $("deliveryZone").value = "ঢাকার ভিতরে";
    updateTotals();
    button.textContent = "অর্ডার জমা হয়েছে";

  } catch (error) {
    console.error("Order submission error:", error);
    showMessage(
      error.message && error.message.includes("সব প্রয়োজনীয়")
        ? error.message
        : "অর্ডার জমা হয়নি। Firebase Rules, ইন্টারনেট এবং পণ্যের তথ্য পরীক্ষা করতে হবে।",
      "err"
    );
    button.disabled = false;
    button.textContent = "আবার চেষ্টা করুন";
    return;
  }

  button.disabled = false;
  button.textContent = "অর্ডার নিশ্চিত করুন";
});

async function loadSiteSettings() {
  try {
    const snapshot = await getDoc(doc(db, "settings", "site"));
    if (!snapshot.exists()) return;

    const data = snapshot.data();

    if (data.siteName) $("siteName").textContent = data.siteName;
    if (data.promoText) {
      $("promo").textContent = data.promoText;
      $("promo").hidden = false;
    }

    if (data.logoUrl) {
      $("logo").src = data.logoUrl;
      $("logo").hidden = false;
      $("logo").onerror = () => { $("logo").hidden = true; };
    }

    if (data.bannerUrl) {
      $("banner").src = data.bannerUrl;
      $("banner").style.display = "block";
      $("banner").onerror = () => { $("banner").style.display = "none"; };
    }

    if (data.supportText) $("supportText").textContent = data.supportText;

    const links = $("supportLinks");
    links.replaceChildren();

    const supportItems = [
      ["WhatsApp", data.whatsappLink],
      ["Telegram", data.telegramLink],
      ["Messenger", data.messengerLink]
    ];

    supportItems.forEach(([label, url]) => {
      if (!url || !/^https:\/\/\S+/i.test(url)) return;
      const a = document.createElement("a");
      a.href = url;
      a.textContent = label;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      links.appendChild(a);
    });

    if (data.phoneNumber) {
      const a = document.createElement("a");
      a.href = "tel:" + data.phoneNumber;
      a.textContent = "ফোন করুন";
      links.appendChild(a);
    }

    if (data.supportEmail) {
      const a = document.createElement("a");
      a.href = "mailto:" + data.supportEmail;
      a.textContent = "ইমেইল";
      links.appendChild(a);
    }

  } catch (error) {
    console.error("Site settings error:", error);
  }
}

function loadProducts() {
  if (stopProducts) stopProducts();

  stopProducts = onSnapshot(collection(db, "products"), snapshot => {
    allProducts = snapshot.docs.map(item => ({
      id: item.id,
      ...item.data()
    }));

    renderCategories();
    renderProducts();

  }, error => {
    console.error("Products loading error:", error);
    $("productList").replaceChildren();

    const message = document.createElement("div");
    message.className = "empty";
    message.textContent =
      "পণ্য লোড করা যায়নি। Firestore Rules ও products কালেকশন পরীক্ষা করুন।";
    $("productList").appendChild(message);
  });
}

loadProducts();
loadSiteSettings();
</script>

</body>
</html>
