
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | সততা সপ</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e8fff1, #e8edff);
    }
    .card {
      width: 100%;
      max-width: 390px;
      padding: 28px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 10px 35px #00000015;
    }
    h2 { text-align: center; color: #087443; }
    p { text-align: center; color: #666; }
    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 9px;
      font-size: 15px;
    }
    input { border: 1px solid #ccc; }
    button {
      border: 0;
      background: #087443;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    #message { font-size: 14px; overflow-wrap: anywhere; }
    #dashboard { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <section id="login">
      <h2>সততা সপ</h2>
      <p>Admin Panel Login</p>

      <form id="loginForm">
        <input
          id="email"
          type="email"
          placeholder="Admin ইমেইল"
          value="nahidulislam01832@gmail.com"
          required
        >
        <input
          id="password"
          type="password"
          placeholder="Firebase পাসওয়ার্ড"
          required
        >
        <button type="submit" id="loginButton">লগইন করুন</button>
      </form>
      <p id="message" role="status"></p>
    </section>

    <section id="dashboard">
      <h2>Admin Dashboard</h2>
      <p>সততা সপ Admin Panel-এ লগইন সফল হয়েছে।</p>
      <button id="logoutButton">লগআউট</button>
    </section>
  </div>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDHHTt4EFkH_H5xc2q2rGTC2piSCjOJuKM",
      authDomain: "satata-shop.firebaseapp.com",
      projectId: "satata-shop",
      storageBucket: "satata-shop.firebasestorage.app",
      messagingSenderId: "964264833764",
      appId: "1:964264833764:web:7c77ae2f3cb8c782abf2f1",
      measurementId: "G-1H2H45YG3D"
    };

    const ADMIN_EMAILS = [
      "nahidulislam01832@gmail.com"
    ].map(email => email.toLowerCase());

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loginSection = document.getElementById("login");
    const dashboard = document.getElementById("dashboard");
    const message = document.getElementById("message");
    const loginButton = document.getElementById("loginButton");

    document.getElementById("loginForm").addEventListener(
      "submit", async event => {
        event.preventDefault();
        message.textContent = "";
        loginButton.disabled = true;

        const email = document.getElementById("email")
          .value.trim().toLowerCase();
        const password = document.getElementById("password").value;

        if (!ADMIN_EMAILS.includes(email)) {
          message.textContent =
            "এই ইমেইল Admin Panel-এর অনুমোদিত তালিকায় নেই।";
          loginButton.disabled = false;
          return;
        }

        try {
          await signInWithEmailAndPassword(auth, email, password);
        } catch (error) {
          message.textContent =
            error.code === "auth/invalid-credential"
              ? "ইমেইল অথবা পাসওয়ার্ড সঠিক নয়।"
              : "লগইন হয়নি: " + error.message;
        } finally {
          loginButton.disabled = false;
        }
      }
    );

    onAuthStateChanged(auth, user => {
      const isAdmin = user &&
        user.email &&
        ADMIN_EMAILS.includes(user.email.toLowerCase());

      loginSection.style.display = isAdmin ? "none" : "block";
      dashboard.style.display = isAdmin ? "block" : "none";

      if (user && !isAdmin) {
        signOut(auth);
        message.textContent = "এই অ্যাকাউন্ট Admin হিসেবে অনুমোদিত নয়।";
      }
    });

    document.getElementById("logoutButton").addEventListener(
      "click", () => signOut(auth)
    );
  </script>
</body>
</html>
