
<div class="card">
  <h2>সততা সপ — Admin Login</h2>

  <form id="loginForm">
    <label for="email">অ্যাডমিন ইমেইল</label>
    <input
      id="email"
      type="email"
      value="nahidulislam01832@gmail.com"
      autocomplete="username"
      required
    >

    <label for="password">পাসওয়ার্ড</label>
    <input
      id="password"
      type="password"
      placeholder="পাসওয়ার্ড লিখুন"
      autocomplete="current-password"
      required
    >

    <button type="submit">লগইন করুন</button>
    <button type="button" id="resetPassword">
      পাসওয়ার্ড রিসেট
    </button>

    <p id="loginMessage"></p>
  </form>
</div>

<script type="module">
  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword,
    sendPasswordResetEmail
  } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDHHTt4EFkH_H5xc2q2rGTC2piSCjOJuKM",
    authDomain: "satata-shop.firebaseapp.com",
    projectId: "satata-shop",
    storageBucket: "satata-shop.firebasestorage.app",
    messagingSenderId: "964264833764",
    appId: "1:964264833764:web:7c77ae2f3cb8c782abf2f1",
    measurementId: "G-1H2H45YG3D"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const form = document.getElementById("loginForm");
  const message = document.getElementById("loginMessage");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    message.textContent = "লগইন হচ্ছে...";

    try {
      await signInWithEmailAndPassword(
        auth,
        document.getElementById("email").value.trim(),
        document.getElementById("password").value
      );

      message.textContent = "লগইন সফল হয়েছে।";
      // এখানে তোমার Admin Dashboard দেখানোর ব্যবস্থা যুক্ত করতে হবে।
    } catch (error) {
      message.textContent =
        error.code === "auth/invalid-credential"
          ? "ইমেইল বা পাসওয়ার্ড সঠিক নয়।"
          : "লগইন হয়নি: " + error.message;
    }
  });

  document.getElementById("resetPassword")
    .addEventListener("click", async () => {
      try {
        await sendPasswordResetEmail(
          auth,
          document.getElementById("email").value.trim()
        );
        message.textContent =
          "পাসওয়ার্ড রিসেটের জন্য ইমেইল চেক করুন।";
      } catch (error) {
        message.textContent = "সমস্যা: " + error.message;
      }
    });
</script>
